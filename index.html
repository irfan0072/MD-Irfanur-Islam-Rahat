<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f5c63" />
    <meta name="description" content="Turn your tender papers into one checked, correctly ordered PDF package. Works in your browser. Your files never leave your device." />
    <title>Tender Package Builder</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230f766e'/%3E%3Cpath d='M20 14h16l10 10v24a4 4 0 0 1-4 4H20a4 4 0 0 1-4-4V18a4 4 0 0 1 4-4z' fill='%23fff'/%3E%3Cpath d='m24 35 5 5 10-11' fill='none' stroke='%230f766e' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <style>
      /* Start screen. It is plain HTML and CSS so it paints before any app code arrives,
         and stays up until saved work is restored, so the empty landing page never flashes. */
      body { margin: 0; background: #f5f8f8; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      #boot {
        position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 24px; text-align: center;
        background:
          radial-gradient(1100px 520px at 8% -10%, rgb(204 251 241 / .75), transparent 60%),
          radial-gradient(900px 480px at 100% 0%, rgb(254 243 199 / .6), transparent 55%),
          #f5f8f8;
        transition: opacity .2s ease-out;
      }
      #boot.out { opacity: 0; pointer-events: none; }
      .bl-mark { position: relative; width: 96px; height: 96px; margin: 0 auto; }
      .bl-mark::before { content: ""; position: absolute; inset: -10px; border-radius: 34px; background: #99f6e4; animation: bl-halo 1.8s ease-out infinite; }
      .bl-mark svg { position: relative; display: block; width: 96px; height: 96px; filter: drop-shadow(0 12px 18px rgb(15 118 110 / .28)); animation: bl-float 1.8s ease-in-out infinite; }
      .bl-check { stroke-dasharray: 24; stroke-dashoffset: 24; animation: bl-draw 1.8s ease-in-out infinite; }
      .bl-name { margin: 22px 0 4px; font-size: 20px; font-weight: 700; color: #0f172a; }
      .bl-label { margin: 0; font-size: 15px; font-weight: 600; color: #0f766e; }
      .bl-bar { width: 168px; height: 6px; margin: 16px auto 0; border-radius: 99px; background: #ccfbf1; overflow: hidden; }
      .bl-bar i { display: block; width: 40%; height: 100%; border-radius: 99px; background: #0f766e; animation: bl-slide 1.1s ease-in-out infinite; }
      #boot-help { max-width: 340px; margin: 22px auto 0; padding: 16px; border-radius: 20px; background: #fff; border: 1px solid #e2e8f0; box-shadow: 0 12px 32px -18px rgb(15 23 42 / .25); }
      #boot-help[hidden] { display: none; }
      #boot-help p { margin: 0 0 12px; font-size: 14px; line-height: 1.5; color: #334155; }
      #boot-help .bl-note { margin: 10px 0 0; font-size: 12px; color: #64748b; }
      #boot-help button { min-height: 44px; margin: 4px; padding: 0 16px; border: 0; border-radius: 14px; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer; }
      .bl-a { background: #0f766e; color: #fff; }
      .bl-b { background: #f1f5f9; color: #334155; }
      /* When the app could not start, nothing should look like it is still working. */
      #boot.stuck .bl-mark::before, #boot.stuck .bl-mark svg, #boot.stuck .bl-check { animation: none; }
      #boot.stuck .bl-mark::before, #boot.stuck .bl-bar { display: none; }
      @keyframes bl-draw { 0%, 15% { stroke-dashoffset: 24; } 55%, 85% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 24; } }
      @keyframes bl-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
      @keyframes bl-halo { 0% { transform: scale(.86); opacity: .6; } 100% { transform: scale(1.18); opacity: 0; } }
      @keyframes bl-slide { from { transform: translateX(-110%); } to { transform: translateX(260%); } }
      @media (prefers-reduced-motion: reduce) {
        .bl-mark::before, .bl-mark svg, .bl-check, .bl-bar i { animation: none; }
        .bl-mark::before { opacity: 0; }
        .bl-check { stroke-dashoffset: 0; }
        .bl-bar i { width: 100%; opacity: .35; }
        #boot { transition: none; }
      }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-live="polite" aria-busy="true">
      <div>
        <div class="bl-mark">
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <rect width="64" height="64" rx="18" fill="#0f766e" />
            <path d="M20 14h16l10 10v24a4 4 0 0 1-4 4H20a4 4 0 0 1-4-4V18a4 4 0 0 1 4-4z" fill="#fff" />
            <path class="bl-check" d="m24 35 5 5 10-11" fill="none" stroke="#0f766e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </div>
        <p class="bl-name" id="bl-name">Tender Package Builder</p>
        <p class="bl-label" id="bl-label">Opening your work…</p>
        <div class="bl-bar" aria-hidden="true"><i></i></div>
        <div id="boot-help" role="alert" hidden>
          <p id="bl-help">This is taking longer than it should. Check your internet connection and try again.</p>
          <button class="bl-a" id="bl-retry" type="button">Try again</button>
          <button class="bl-b" id="bl-fresh" type="button">Start fresh</button>
          <p class="bl-note" id="bl-note">Start fresh removes the work saved in this browser.</p>
        </div>
      </div>
    </div>
    <div id="app"></div>
    <script>
      (function () {
        var d = document
        var boot = d.getElementById('boot')
        var lang
        try { lang = localStorage.getItem('tpb-lang') } catch (e) {}
        if (lang !== 'bn' && lang !== 'en') lang = (navigator.language || '').toLowerCase().indexOf('bn') === 0 ? 'bn' : 'en'
        if (lang === 'bn') {
          d.documentElement.lang = 'bn'
          var text = {
            'bl-name': 'টেন্ডার প্যাকেজ বিল্ডার',
            'bl-label': 'আপনার কাজ খোলা হচ্ছে…',
            'bl-help': 'স্বাভাবিকের চেয়ে বেশি সময় লাগছে। ইন্টারনেট সংযোগ দেখে আবার চেষ্টা করুন।',
            'bl-retry': 'আবার চেষ্টা করুন',
            'bl-fresh': 'নতুন করে শুরু',
            'bl-note': 'নতুন করে শুরু করলে এই ব্রাউজারে রাখা কাজ মুছে যাবে।'
          }
          for (var k in text) d.getElementById(k).textContent = text[k]
        }
        // The way out is offered only when the app fails while starting or does not take over in time.
        function help() {
          if (!boot.isConnected) return
          d.getElementById('boot-help').hidden = false
          boot.setAttribute('aria-busy', 'false')
          boot.classList.add('stuck')
        }
        function onError(e) {
          var t = e && e.target
          if (!t || t === window || t.tagName === 'SCRIPT' || t.tagName === 'LINK') help()
        }
        var timer = setTimeout(help, 8000)
        addEventListener('error', onError, true)
        addEventListener('unhandledrejection', help)
        d.getElementById('bl-retry').onclick = function () { location.reload() }
        d.getElementById('bl-fresh').onclick = function () {
          try {
            var r = indexedDB.deleteDatabase('tender-package-builder')
            r.onsuccess = r.onerror = r.onblocked = function () { location.reload() }
          } catch (e) { location.reload() }
        }
        // Called by the app the moment saved work is restored. No waiting is added.
        window.__bootDone = function () {
          clearTimeout(timer)
          removeEventListener('error', onError, true)
          removeEventListener('unhandledrejection', help)
          boot.classList.add('out')
          setTimeout(function () { boot.remove() }, 220)
        }
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
